<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voyage Hotel</title>
    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">

</head>
<body>
    <div class="container">
        <nav class="navbar">
            <img src="img/hotel-voyage.png" class="logo">
            <ul>
                <li><a href="">Home</a></li>
                <li><a href="">Rooms</a></li>
                <li><a href="">Dining</a></li>
                <li><a href="">Spa</a></li>
                <li><a href="">Offers</a></li>
                <li><a href="">Gallery</a></li>
            </ul>
            <div class="button-book-profile">
                <button class="book">BOOK A STAY</button>
                <button class="profile"></button>
            </div>
        </nav>
    
        <section class="hero">
            <div class="hero-img">
                <h2 class="heading">EXPERIENCE<br>PARADISE</h2>
                <p>Your Serene Escape on the Ball Coastline Discover<br>unparalleled luxury and breathtaking ocean views</p>
            </div>
        </section>

        <section class="search">
            <div class="inputDate">
                <label for="dateIO">Check In/Check Out</label>
                <input type="date" name="dateIO" id="dateIO">
            </div>
            <div class="inputGuest">
                <label for="guest">Guest</label>
                <select name="guest" id="guest">
                    <option value="Guests">Guests</option>
                    <option value="1">1 Guests</option>
                    <option value="2">2 Guests</option>
                    <option value="x">>2 Guests</option>
                </select>
            </div>
            <div class="inputRoom">
                <label for="roomType">Room Type</label>
                <select name="roomType" id="roomType">
                    <option value="roomType">Room Type</option>
                    <option value="Basic">Room Basic</option>
                    <option value="Suite">Room Suite</option>
                </select>
            </div>
            <button>Search Now</button>
        </section>

        <section class="suites-dining">
            <div class="exclusive-suites">
                <div class="suite s1">
                    <img src="img/rooms/reguler.png" alt="">
                    <h3></h3>
                    <button>View Details</button>
                </div>
                <div class="suite s2">
                    <img src="img/rooms/deluxe.png" alt="">
                    <h3></h3>
                    <button>View Details</button>
                </div>
                <div class="suite s3">
                    <img src="img/rooms/suite.png" alt="">
                    <h3></h3>
                    <button>View Details</button>
                </div>
            </div>
            <div class="dining-exp">
                <div class="dining d1">
                    <img src="" alt="">
                    <h3></h3>
                    <button>View Details</button>
                </div>
                <div class="dining d2">
                    <img src="" alt="">
                    <h3></h3>
                    <button>View Details</button>
                </div>
            </div>
        </section>

    </div>
</body>
</html>
