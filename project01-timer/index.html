<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIMER</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <section class="set-timer">
            <h2 class="waktu">00:00</h2>
        </section>
        <section class="all-button">
            <input type="number" max="59" min="1" placeholder="Menit" id="inputTimer">
            <button type="button" id="btn-start">Start</button>
            <button type="button" id="btn-stop">Stop</button>
            <button type="button" id="btn-reset">Reset</button>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
